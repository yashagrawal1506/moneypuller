name: morning-update

# Redundant slots: GitHub's cron scheduler regularly delays or skips single
# slots under load. The first slot that actually runs does the work; the
# freshness guard makes every later slot a seconds-cheap no-op.
on:
  schedule:
    - cron: "15 3 * * 1-5"   # 08:45 IST primary (pre-market)
    - cron: "5 4 * * 1-5"    # 09:35 IST catch-up 1
    - cron: "35 5 * * 1-5"   # 11:05 IST catch-up 2 (last of the morning)
  workflow_dispatch: {}        # manual run button (bypasses the guard)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      result: ${{ steps.guard.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      # Persist the DB between runs: each run saves its updated DB under a
      # key unique to the run; the next run restores the newest entry via
      # the db-v1- prefix. The committed seed is the cold-start fallback.
      - name: Restore DB from cache
        uses: actions/cache/restore@v4
        with:
          path: data/moneypuller.db
          key: db-v1-${{ github.run_id }}
          restore-keys: |
            db-v1-
            moneypuller-db-

      - name: Seed DB if cache missed
        run: |
          if [ -f data/moneypuller.db ]; then
            echo "DB restored from cache: $(du -h data/moneypuller.db | cut -f1)"
          else
            echo "cache miss - restoring DB from committed seed"
            gunzip -c data/db_seed.gz > data/moneypuller.db
          fi

      - name: DB provenance
        run: python -c "import sqlite3; conn = sqlite3.connect('data/moneypuller.db'); print('articles', conn.execute('SELECT COUNT(*) FROM articles').fetchone()[0], '| newest article', conn.execute('SELECT MAX(substr(fetched_at,1,10)) FROM articles').fetchone()[0])"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      # Guard: if any article was already fetched today (IST), a previous
      # slot did the morning work — skip the whole run. Manual dispatches
      # bypass the guard.
      - name: Freshness guard
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            R=run-needed
          else
            R=$(python freshness_guard.py morning) || R=run-needed
          fi
          echo "result=$R" >> "$GITHUB_OUTPUT"
          echo "morning guard: $R"

      - name: Run morning update (no price fetch)
        if: steps.guard.outputs.result == 'run-needed'
        env:
          MP_PAUSE: "1.2"
        run: python daily_update.py --cloud --no-fetch

      - name: DB summary
        if: steps.guard.outputs.result == 'run-needed'
        run: >-
          python -c "import sqlite3; conn = sqlite3.connect('data/moneypuller.db');
          [print(n, conn.execute(q).fetchone()[0]) for n, q in [('articles',
          'SELECT COUNT(*) FROM articles'), ('leads', 'SELECT COUNT(*) FROM
          recommendations'), ('verdicts', 'SELECT COUNT(*) FROM verdicts')]]"

      - name: Assemble site
        if: steps.guard.outputs.result == 'run-needed'
        run: python make_site.py

      - name: Upload Pages artifact
        if: steps.guard.outputs.result == 'run-needed'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Hand today's updated DB to the next run (prefix restore picks the
      # newest db-v1-* entry). Skipped when the guard short-circuited.
      - name: Save DB to cache
        if: steps.guard.outputs.result == 'run-needed'
        uses: actions/cache/save@v4
        with:
          path: data/moneypuller.db
          key: db-v1-${{ github.run_id }}

  deploy-pages:
    needs: update
    if: needs.update.outputs.result == 'run-needed'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
