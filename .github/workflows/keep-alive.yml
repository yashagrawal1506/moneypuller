name: keep-alive

# GitHub auto-disables scheduled workflows in public repos after 60 days
# without repository activity. Weekly slots + a guard make this immune to
# GitHub's cron skips: if a slot is skipped or delayed, the next one still
# runs, and the guard ensures only ONE empty commit lands roughly per month
# (only when the newest commit is older than 20 days).

on:
  schedule:
    - cron: "30 0 * * 1"   # Mondays 06:00 IST
    - cron: "30 0 * * 4"   # Thursdays 06:00 IST (backup slot)
  workflow_dispatch: {}      # manual run (bypasses the guard, for testing)

permissions:
  contents: write
  issues: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Guard — commit only if last commit is >20 days old
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "result=run-needed" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE=$(( (NOW - LAST) / 86400 ))
          echo "last commit age: ${AGE} days"
          if [ "$AGE" -gt 20 ]; then
            echo "result=run-needed" >> "$GITHUB_OUTPUT"
          else
            echo "result=already-done" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep-alive commit
        if: steps.guard.outputs.result == 'run-needed'
        run: |
          git config user.name  "MoneyPuller"
          git config user.email "moneypuller@users.noreply.github.com"
          git commit --allow-empty -m "chore: monthly keep-alive (reset 60-day workflow inactivity clock)"
          # GitHub's push for actions is always the GITHUB_TOKEN, whose
          # default scope is `contents: write` on the default `GITHUB_TOKEN`
          # and `issues: write` when `permissions.issues.write` is declared.
          # The GITHUB_TOKEN is scoped to the repo and cannot be factored out,
          # so we use `gh` with a fine-grained PAT stored in the repo secret
          # GH_PAT. That token has `contents: write` on this repository.
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/yashagrawal1506/moneypuller.git
            git push origin HEAD:main
          else
            echo "GH_PAT secret not set — keep-alive commit skipped. Add it in Settings > Secrets and variables > Actions > New repository secret (name: GH_PAT, value: a fine-grained PAT with Contents: Write)."
            exit 1
          fi
