name: keep-alive

# GitHub auto-disables scheduled workflows in public repos after 60 days
# without repository activity. This job makes one empty commit on the 1st
# of every month, resetting that clock so the morning/evening crons never
# stop. The commit changes no files and cannot trigger the other workflows
# (they have no push triggers).

on:
  schedule:
    - cron: "30 0 1 * *"   # 00:30 UTC on the 1st = 06:00 IST, monthly
  workflow_dispatch: {}      # manual run button for testing

permissions:
  contents: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep-alive commit
        run: |
          git config user.name  "MoneyPuller"
          git config user.email "moneypuller@users.noreply.github.com"
          git commit --allow-empty -m "chore: monthly keep-alive (reset 60-day workflow inactivity clock)"
          git push
